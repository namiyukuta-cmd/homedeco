<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>部屋</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="topbar"><button class="btn" onclick="location.href='homedeco_menu.html'">←</button><h1 id="roomName">部屋</h1><button class="btn" onclick="location.href='homedeco_gomi.html'">ゴミ</button></div><section class="panel"><div id="stage" class="room-stage"></div><p class="legend">家具をタップすると中身を開きます。</p></section></main><script src="js/homedeco_rooms.js"></script><script src="js/homedeco_furniture.js"></script><script>
const id=new URLSearchParams(location.search).get('room')||'livingKitchen',room=HOMEDECO_ROOMS[id];if(!room){location.href='homedeco_menu.html';}else{document.getElementById('roomName').textContent=room.name;const st=document.getElementById('stage');st.style.setProperty('--cols',room.cols);st.style.setProperty('--rows',room.rows);room.furniture.forEach(fid=>{const f=HOMEDECO_FURNITURE[fid];if(!f)return;const b=document.createElement('button');b.className='furniture';b.textContent=f.name;b.style.left=(f.x/room.cols*100)+'%';b.style.top=(f.y/room.rows*100)+'%';b.style.width=(f.w/room.cols*100)+'%';b.style.height=(f.h/room.rows*100)+'%';b.onclick=()=>location.href='homedeco_item.html?furniture='+encodeURIComponent(fid);st.appendChild(b)})}
</script></body></html>
