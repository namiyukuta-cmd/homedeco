<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>調味料</title>
<link rel="stylesheet" href="style.css?v=20260831-12">
<style>
.seasoning-list-head,.seasoning-row{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px;align-items:center}.seasoning-list-head{padding:10px 12px;background:#f6ece5;border-bottom:2px solid #cdbdb4;font-size:15px;font-weight:900}.seasoning-list-head span:last-child{text-align:right}.seasoning-row-wrap{border-bottom:1px solid #ded2cb}.seasoning-row-wrap:last-child{border-bottom:0}.seasoning-row{appearance:none;width:100%;border:0;background:#fff;color:var(--ink);padding:11px 12px;text-align:left;font-family:inherit;font-size:16px;line-height:1.35;cursor:pointer}.seasoning-name{font-weight:800}.seasoning-qty{text-align:right;white-space:nowrap;font-weight:700}.seasoning-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 10px 10px;background:#fffaf7}.seasoning-actions[hidden]{display:none}.seasoning-actions .btn{min-height:44px;padding:7px 5px;font-size:15px;border-radius:10px}
</style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <button class="btn" onclick="location.href='homedeco_menu.html?v=20260831-12'">←</button>
    <h1>調味料</h1>
    <button class="btn" onclick="location.href='homedeco_gomi.html?v=20260831-12'">ゴミ</button>
  </div>

  <section class="panel add-item-panel">
    <button class="btn primary add-toggle" id="toggleAddBtn" type="button">＋ 調味料を追加</button>
    <form id="addForm" class="item-form" hidden>
      <div class="field quick-pick-field" id="favoriteField" hidden>
        <label>よく買うもの</label>
        <div id="favoriteItems" class="quick-pick-grid"></div>
      </div>
      <div class="field">
        <label for="itemName">名前</label>
        <input id="itemName" autocomplete="off" placeholder="なければ入力" required>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="itemQuantity">数量</label>
          <select id="itemQuantity"></select>
        </div>
        <div class="field">
          <label for="itemUnit">単位</label>
          <input id="itemUnit" autocomplete="off" placeholder="なければ入力">
        </div>
      </div>
      <div class="field quick-pick-field">
        <label>よく使う単位</label>
        <div id="unitPicks" class="quick-pick-grid"></div>
      </div>
      <div class="field">
        <label for="itemMemo">メモ（任意）</label>
        <textarea id="itemMemo" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn primary" type="submit">追加する</button>
        <button class="btn" id="cancelAddBtn" type="button">キャンセル</button>
      </div>
    </form>
  </section>

  <section class="panel misc-list-panel">
    <div class="seasoning-list-head"><span>品名</span><span>残数量</span></div>
    <div id="seasoningList"></div>
  </section>
</main>

<script src="js/homedeco_items.js?v=20260831-12"></script>
<script src="js/homedeco_save.js?v=20260831-12"></script>
<script>
const addForm=document.getElementById('addForm');
const toggleAddBtn=document.getElementById('toggleAddBtn');
const itemName=document.getElementById('itemName');
const itemQuantity=document.getElementById('itemQuantity');
const itemUnit=document.getElementById('itemUnit');
const favoriteField=document.getElementById('favoriteField');
const favoriteItems=document.getElementById('favoriteItems');
const unitPicks=document.getElementById('unitPicks');
const COMMON_UNITS=['個','本','袋','パック','箱','枚','g','kg','ml','L'];

for(let n=1;n<=20;n++){
  const option=document.createElement('option');
  option.value=String(n);
  option.textContent=String(n);
  itemQuantity.appendChild(option);
}
itemQuantity.value='1';

function renderFavorites(){
  favoriteItems.innerHTML='';
  const favorites=HomeDecoSave.getFavorites('seasoning');
  favoriteField.hidden=!favorites.length;
  favorites.forEach(fav=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='quick-pick-btn';
    b.textContent=fav.name;
    b.onclick=()=>{
      itemName.value=fav.name;
      favoriteItems.querySelectorAll('.quick-pick-btn').forEach(x=>x.classList.toggle('selected',x===b));
    };
    favoriteItems.appendChild(b);
  });
}

function renderUnitPicks(){
  unitPicks.innerHTML='';
  COMMON_UNITS.forEach(unit=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='quick-pick-btn';
    b.dataset.unit=unit;
    b.textContent=unit;
    b.onclick=()=>{itemUnit.value=unit;syncUnitSelection();};
    unitPicks.appendChild(b);
  });
}
function syncUnitSelection(){
  const value=itemUnit.value.trim();
  unitPicks.querySelectorAll('.quick-pick-btn').forEach(b=>b.classList.toggle('selected',b.dataset.unit===value));
}
itemUnit.addEventListener('input',syncUnitSelection);

renderFavorites();
renderUnitPicks();

toggleAddBtn.onclick=()=>{
  addForm.hidden=!addForm.hidden;
  toggleAddBtn.textContent=addForm.hidden?'＋ 調味料を追加':'− 入力を閉じる';
};
document.getElementById('cancelAddBtn').onclick=()=>{
  addForm.hidden=true;
  addForm.reset();
  itemQuantity.value='1';
  toggleAddBtn.textContent='＋ 調味料を追加';
  favoriteItems.querySelectorAll('.quick-pick-btn').forEach(x=>x.classList.remove('selected'));
  syncUnitSelection();
};

addForm.addEventListener('submit',e=>{
  e.preventDefault();
  const name=itemName.value.trim();
  const unit=itemUnit.value.trim();
  if(!name)return;
  HomeDecoSave.addItem({
    name,
    furniture:'',
    section:'seasoning',
    quantity:itemQuantity.value,
    unit,
    memo:document.getElementById('itemMemo').value
  });
  HomeDecoSave.addFavorite('seasoning',name,unit);
  addForm.reset();
  itemQuantity.value='1';
  addForm.hidden=true;
  toggleAddBtn.textContent='＋ 調味料を追加';
  syncUnitSelection();
  renderFavorites();
  render();
});

function render(){
  const list=document.getElementById('seasoningList');
  list.innerHTML='';
  const rows=Object.entries(HomeDecoSave.ensure().items)
    .filter(([,item])=>!item.furniture&&item.section==='seasoning')
    .sort((a,b)=>a[1].name.localeCompare(b[1].name,'ja'));
  if(!rows.length){
    const empty=document.createElement('div');
    empty.className='empty';
    empty.textContent='まだ調味料は登録されていません。';
    list.appendChild(empty);
    return;
  }
  rows.forEach(([iid,item])=>{
    const wrap=document.createElement('div');
    wrap.className='seasoning-row-wrap';
    const row=document.createElement('button');
    row.type='button';
    row.className='seasoning-row';
    row.innerHTML='<span class="seasoning-name">'+esc(item.name)+'</span><span class="seasoning-qty">'+esc(item.quantity)+' '+esc(item.unit||'')+'</span>';
    const actions=document.createElement('div');
    actions.className='seasoning-actions';
    actions.hidden=true;
    actions.append(editBtn('数量変更',()=>changeQuantity(iid,item)),editBtn('削除',()=>removeItem(iid,item),'danger'));
    row.onclick=()=>{actions.hidden=!actions.hidden;};
    wrap.append(row,actions);
    list.appendChild(wrap);
  });
}
function editBtn(label,fn,extra=''){
  const b=document.createElement('button');
  b.type='button';
  b.className='btn'+(extra?' '+extra:'');
  b.textContent=label;
  b.onclick=fn;
  return b;
}
function changeQuantity(iid,item){
  const n=prompt('数量',item.quantity);
  if(n===null)return;
  const v=Number(n);
  if(!Number.isFinite(v)||v<0)return alert('0以上の数字を入力してください。');
  HomeDecoSave.updateItem(iid,{quantity:v});
  render();
}
function removeItem(iid,item){
  if(!confirm(item.name+'を一覧から削除しますか？'))return;
  HomeDecoSave.removeItem(iid);
  render();
}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
render();
</script>
</body>
</html>
