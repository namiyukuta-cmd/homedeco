<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Home Deco</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><h1 class="title">HOME DECO</h1><section class="panel"><p>自分の家・収納・ゴミを管理します。</p><div class="actions"><button id="newBtn" class="btn primary">はじめから</button><button id="continueBtn" class="btn soft">続きから</button></div><p id="saveInfo" class="muted"></p></section></main><script src="js/homedeco_items.js"></script><script src="js/homedeco_save.js"></script><script>
