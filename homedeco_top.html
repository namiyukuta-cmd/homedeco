<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home Deco</title>
<link rel="stylesheet" href="style.css?v=20260831-9">
<style>
.github-login{margin-top:14px}.github-token-input{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border:1px solid #bfae9b;border-radius:10px;background:#fff}.github-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.github-row .btn{flex:1;min-width:130px}.cloud-status{margin-top:8px;font-size:15px;line-height:1.5}.github-title{font-size:19px;margin:0 0 8px}.github-path{font-size:14px;margin:0 0 8px;word-break:break-all}
</style>
</head>
<body>
<main class="app">
  <h1 class="title">HOME DECO</h1>

  <section class="panel github-login">
    <h2 class="github-title">GitHubセーブ設定</h2>
    <p class="muted github-path">保存先：private-game-data / homedeco / save.json</p>
    <input id="tokenInput" class="github-token-input" type="password" autocomplete="off" placeholder="GitHubトークンを入力">
    <div class="github-row">
      <button id="tokenSaveBtn" class="btn primary" type="button">トークンを確認・設定</button>
      <button id="cloudLoadBtn" class="btn soft" type="button">GitHubから読込</button>
    </div>
    <p id="cloudStatus" class="cloud-status muted"></p>
  </section>

  <section class="panel">
    <p>自分の家・収納・ゴミを管理します。</p>
    <div class="actions">
      <button id="newBtn" class="btn primary">はじめから</button>
      <button id="continueBtn" class="btn soft">続きから</button>
    </div>
    <p id="saveInfo" class="muted"></p>
  </section>
</main>
<script src="js/homedeco_items.js?v=20260831-9"></script>
<script src="js/homedeco_save.js?v=20260831-9"></script>
<script>
const info=document.getElementById('saveInfo');
const cloudStatus=document.getElementById('cloudStatus');
const tokenInput=document.getElementById('tokenInput');

function refreshSaveInfo(){
  const s=HomeDecoSave.load();
  info.textContent=s?'端末内セーブあり：'+new Date(s.updatedAt).toLocaleString('ja-JP'):'端末内セーブはありません。';
}

async function verifyStoredToken(){
  if(!HomeDecoSave.getToken()){cloudStatus.textContent='GitHubトークン未設定';return false;}
  cloudStatus.textContent='GitHubトークンを確認中…';
  try{
    await HomeDecoSave.checkToken();
    cloudStatus.textContent='GitHub認証OK。Home Decoの「保存」でGitHubにも保存できます。';
    return true;
  }catch(e){
    if(e.status===401)HomeDecoSave.clearToken();
    cloudStatus.textContent=e.message;
    return false;
  }
}

refreshSaveInfo();
verifyStoredToken();

document.getElementById('newBtn').onclick=()=>{
  const s=HomeDecoSave.load();
  if(s&&!confirm('端末内の現在セーブを消して、はじめからにしますか？'))return;
  HomeDecoSave.reset();
  location.href='homedeco_menu.html?v=20260831-9';
};

document.getElementById('continueBtn').onclick=()=>location.href='homedeco_menu.html?v=20260831-9';

document.getElementById('tokenSaveBtn').onclick=async()=>{
  const token=tokenInput.value;
  if(!token.trim()){alert('トークンを入力してください。');return;}
  cloudStatus.textContent='GitHubでトークンを確認中…';
  HomeDecoSave.setToken(token);
  try{
    await HomeDecoSave.checkToken();
    tokenInput.value='';
    cloudStatus.textContent='GitHub認証OK。設定できました。';
    alert('GitHub認証OKです。');
  }catch(e){
    if(e.status===401)HomeDecoSave.clearToken();
    cloudStatus.textContent=e.message;
    alert(e.message);
  }
};

document.getElementById('cloudLoadBtn').onclick=async()=>{
  const typed=tokenInput.value;
  if(typed.trim())HomeDecoSave.setToken(typed);
  if(!HomeDecoSave.getToken()){alert('トークンを入力してください。');return;}
  cloudStatus.textContent='GitHubから読み込み中…';
  try{await HomeDecoSave.loadFromGitHub();location.href='homedeco_menu.html?v=20260831-9';}
  catch(e){if(e.status===401)HomeDecoSave.clearToken();cloudStatus.textContent=e.message;alert(e.message);}
};
</script>
</body>
</html>
