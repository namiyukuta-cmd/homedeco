<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家具の中</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <div class="topbar">
    <button class="btn" id="backBtn">←</button>
    <h1 id="furnitureName">家具</h1>
    <button class="btn" onclick="location.href='homedeco_gomi.html'">ゴミ</button>
  </div>

  <section class="panel add-item-panel">
    <button class="btn primary" id="toggleAddBtn" type="button">＋ 中身を追加</button>
    <form id="addForm" class="item-form" hidden>
      <div class="field">
        <label for="itemName">名前</label>
        <input id="itemName" name="name" autocomplete="off" placeholder="例：牛乳" required>
      </div>
      <div class="field">
        <label for="itemSection">しまう場所</label>
        <select id="itemSection" name="section"></select>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="itemQuantity">数量</label>
          <input id="itemQuantity" name="quantity" type="number" min="0" step="any" value="1" inputmode="decimal">
        </div>
        <div class="field">
          <label for="itemUnit">単位</label>
          <input id="itemUnit" name="unit" autocomplete="off" placeholder="個・本・袋など">
        </div>
      </div>
      <div class="field">
        <label for="itemExpiration">期限（任意）</label>
        <input id="itemExpiration" name="expiration" type="date">
      </div>
      <div class="field">
        <label for="itemMemo">メモ（任意）</label>
        <textarea id="itemMemo" name="memo" rows="2" placeholder="開封済み、冷凍した日など"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn primary" type="submit">追加する</button>
        <button class="btn" id="cancelAddBtn" type="button">キャンセル</button>
      </div>
    </form>
  </section>

  <section class="panel" id="contents"></section>
</main>

<script src="js/homedeco_furniture.js"></script>
<script src="js/homedeco_items.js"></script>
<script src="js/homedeco_gomi_rules.js"></script>
<script src="js/homedeco_gomi_schedule.js"></script>
<script src="js/homedeco_save.js"></script>
<script>
const fid=new URLSearchParams(location.search).get('furniture');
const f=HOMEDECO_FURNITURE[fid];
const addForm=document.getElementById('addForm');
const toggleAddBtn=document.getElementById('toggleAddBtn');
const cancelAddBtn=document.getElementById('cancelAddBtn');
const sectionSelect=document.getElementById('itemSection');

if(!f){
  location.href='homedeco_menu.html';
}else{
  document.getElementById('furnitureName').textContent=f.name;
  document.getElementById('backBtn').onclick=()=>location.href='homedeco_room.html?room='+encodeURIComponent(f.room);
  f.sections.forEach(secName=>{
    const opt=document.createElement('option');
    opt.value=secName;
    opt.textContent=secName;
    sectionSelect.appendChild(opt);
  });
  render();
}

toggleAddBtn.onclick=()=>{
  addForm.hidden=!addForm.hidden;
  if(!addForm.hidden){document.getElementById('itemName').focus();}
};
cancelAddBtn.onclick=()=>{addForm.hidden=true;addForm.reset();document.getElementById('itemQuantity').value=1;};

addForm.addEventListener('submit',e=>{
  e.preventDefault();
  if(!f)return;
  const name=document.getElementById('itemName').value.trim();
  if(!name)return;
  HomeDecoSave.addItem({
    name,
    furniture:fid,
    section:sectionSelect.value,
    quantity:document.getElementById('itemQuantity').value,
    unit:document.getElementById('itemUnit').value,
    expiration:document.getElementById('itemExpiration').value,
    memo:document.getElementById('itemMemo').value
  });
  addForm.reset();
  document.getElementById('itemQuantity').value=1;
  addForm.hidden=true;
  render();
});

function render(){
  if(!f)return;
  const s=HomeDecoSave.ensure(),root=document.getElementById('contents');
  root.innerHTML='';
  f.sections.forEach(secName=>{
    const sec=document.createElement('section');
    sec.className='section';
    const h=document.createElement('h2');
    h.className='section-title';
    h.textContent=secName;
    sec.appendChild(h);
    const list=document.createElement('div');
    list.className='item-list';
    const rows=Object.entries(s.items).filter(([,i])=>i.furniture===fid&&i.section===secName);
    if(!rows.length){
      const e=document.createElement('div');
      e.className='empty';
      e.textContent='空';
      list.appendChild(e);
    }
    rows.forEach(([iid,item])=>list.appendChild(itemCard(iid,item)));
    sec.appendChild(list);
    root.appendChild(sec);
  });
}

function itemCard(iid,item){
  const d=document.createElement('article');
  d.className='item';
  const rule=HOMEDECO_GOMI_RULES[item.garbage];
  const expiration=item.expiration||'未登録';
  const memo=item.memo?'<span>メモ：'+esc(item.memo)+'</span>':'';
  const trashInfo=rule?'<span>捨て方：'+esc(rule.label)+'</span><span class="muted">'+esc(rule.note||'')+'</span>':'';
  d.innerHTML='<div class="item-head"><span class="item-name">'+esc(item.name)+'</span><span class="badge">'+esc(item.quantity)+' '+esc(item.unit||'')+'</span></div><div class="item-meta"><span>期限：'+esc(expiration)+'</span>'+memo+trashInfo+'</div>';

  const a=document.createElement('div');
  a.className='item-actions';

  const q=document.createElement('button');
  q.className='btn';
  q.textContent='数量変更';
  q.onclick=()=>{
    const n=prompt('数量',item.quantity);
    if(n===null)return;
    const v=Number(n);
    if(!Number.isFinite(v)||v<0)return alert('0以上の数字を入力してください。');
    HomeDecoSave.updateItem(iid,{quantity:v});
    render();
  };

  const move=document.createElement('button');
  move.className='btn';
  move.textContent='場所変更';
  move.onclick=()=>{
    const current=f.sections.indexOf(item.section);
    const options=f.sections.map((x,i)=>(i+1)+': '+x).join('\n');
    const n=prompt('移動先の番号を入力してください。\n'+options,current+1);
    if(n===null)return;
    const index=Number(n)-1;
    if(!Number.isInteger(index)||!f.sections[index])return alert('番号を選んでください。');
    HomeDecoSave.updateItem(iid,{section:f.sections[index]});
    render();
  };

  const ex=document.createElement('button');
  ex.className='btn';
  ex.textContent='期限変更';
  ex.onclick=()=>{
    const v=prompt('期限（例：2026-08-31）',item.expiration||'');
    if(v===null)return;
    HomeDecoSave.updateItem(iid,{expiration:v});
    render();
  };

  const del=document.createElement('button');
  del.className='btn danger';
  del.textContent='削除';
  del.onclick=()=>{
    if(!confirm(item.name+'を一覧から削除しますか？'))return;
    HomeDecoSave.removeItem(iid);
    render();
  };

  a.append(q,move,ex,del);
  d.appendChild(a);
  return d;
}

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
