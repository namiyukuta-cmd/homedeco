<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>家具の中</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="topbar"><button class="btn" id="backBtn">←</button><h1 id="furnitureName">家具</h1><button class="btn" onclick="location.href='homedeco_gomi.html'">ゴミ</button></div><section class="panel" id="contents"></section></main><script src="js/homedeco_furniture.js"></script><script src="js/homedeco_items.js"></script><script src="js/homedeco_gomi_rules.js"></script><script src="js/homedeco_gomi_schedule.js"></script><script src="js/homedeco_save.js"></script><script>
const fid=new URLSearchParams(location.search).get('furniture'),f=HOMEDECO_FURNITURE[fid];if(!f){location.href='homedeco_menu.html';}else{document.getElementById('furnitureName').textContent=f.name;document.getElementById('backBtn').onclick=()=>location.href='homedeco_room.html?room='+encodeURIComponent(f.room);render();}
function render(){if(!f)return;const s=HomeDecoSave.ensure(),root=document.getElementById('contents');root.innerHTML='';f.sections.forEach(secName=>{const sec=document.createElement('section');sec.className='section';const h=document.createElement('h2');h.className='section-title';h.textContent=secName;sec.appendChild(h);const list=document.createElement('div');list.className='item-list';const rows=Object.entries(s.items).filter(([,i])=>i.furniture===fid&&i.section===secName);if(!rows.length){const e=document.createElement('div');e.className='empty';e.textContent='空';list.appendChild(e)}rows.forEach(([iid,item])=>list.appendChild(itemCard(iid,item)));sec.appendChild(list);root.appendChild(sec)});}
function itemCard(iid,item){const d=document.createElement('article');d.className='item';const rule=HOMEDECO_GOMI_RULES[item.garbage];d.innerHTML='<div class="item-head"><span class="item-name">'+esc(item.name)+'</span><span class="badge">'+item.quantity+' '+esc(item.unit||'')+'</span></div><div class="item-meta"><span>保存期限：'+(item.expiration||'未登録')+'</span><span>捨て方：'+(rule?esc(rule.label):'未登録')+'</span>'+(rule?'<span class="muted">'+esc(rule.note)+'</span>':'')+'</div>';const a=document.createElement('div');a.className='item-actions';const q=document.createElement('button');q.className='btn';q.textContent='個数変更';q.onclick=()=>{const n=prompt('個数',item.quantity);if(n===null)return;const v=Number(n);if(!Number.isFinite(v)||v<0)return alert('0以上の数字を入力してください。');const s=HomeDecoSave.ensure();s.items[iid].quantity=v;HomeDecoSave.save(s);render()};const ex=document.createElement('button');ex.className='btn';ex.textContent='保存期限';ex.onclick=()=>{const v=prompt('保存期限（例：2026-08-31）',item.expiration||'');if(v===null)return;const s=HomeDecoSave.ensure();s.items[iid].expiration=v;HomeDecoSave.save(s);render()};const trash=document.createElement('button');trash.className='btn danger';trash.textContent='捨てる';trash.onclick=()=>{const cat=rule?HOMEDECO_GOMI_SCHEDULE[rule.category]:null;if(!confirm(item.name+'をゴミ袋へ入れますか？'))return;HomeDecoSave.discardItem(iid);render();alert((cat?cat.name:'ゴミ')+'の袋に入れました。')};a.append(q,ex,trash);d.appendChild(a);return d;}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
