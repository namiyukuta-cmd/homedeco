<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家具の中</title>
<link rel="stylesheet" href="style.css?v=20260831-8">
</head>
<body>
<main class="app">
  <div class="topbar">
    <button class="btn" id="backBtn">←</button>
    <h1 id="furnitureName">家具</h1>
    <button class="btn" onclick="location.href='homedeco_gomi.html'">ゴミ</button>
  </div>

  <section class="panel add-item-panel">
    <button class="btn primary add-toggle" id="toggleAddBtn" type="button">＋ 中身を追加</button>
    <form id="addForm" class="item-form" hidden>
      <div class="field quick-pick-field" id="favoriteField" hidden>
        <label>よく買うもの</label>
        <div id="favoriteItems" class="quick-pick-grid"></div>
      </div>
      <div class="field">
        <label for="itemName" id="itemNameLabel">名前</label>
        <input id="itemName" name="name" autocomplete="off" placeholder="例：牛乳" required>
      </div>
      <div class="field">
        <label for="itemSection">しまう場所</label>
        <select id="itemSection" name="section"></select>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="itemQuantity">数量</label>
          <input id="itemQuantity" name="quantity" type="number" min="1" max="20" step="1" value="1" readonly>
        </div>
        <div class="field">
          <label for="itemUnit">単位</label>
          <input id="itemUnit" name="unit" autocomplete="off" placeholder="なければ入力">
        </div>
      </div>
      <div class="field quick-pick-field">
        <label>数量を選ぶ</label>
        <div id="quantityPicks" class="quick-pick-grid"></div>
      </div>
      <div class="field quick-pick-field">
        <label>よく使う単位</label>
        <div id="unitPicks" class="quick-pick-grid"></div>
      </div>
      <div class="field">
        <label for="itemExpiration">期限（任意）</label>
        <input id="itemExpiration" name="expiration" type="date">
      </div>
      <div class="field">
        <label for="itemMemo">メモ（任意）</label>
        <textarea id="itemMemo" name="memo" rows="2" placeholder="開封済み、冷凍した日など"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn primary" type="submit">追加する</button>
        <button class="btn" id="cancelAddBtn" type="button">キャンセル</button>
      </div>
    </form>
  </section>

  <section class="storage-contents" id="contents"></section>
</main>

<script src="js/homedeco_furniture.js?v=20260831-8"></script>
<script src="js/homedeco_items.js?v=20260831-8"></script>
<script src="js/homedeco_gomi_rules.js?v=20260831-8"></script>
<script src="js/homedeco_gomi_schedule.js?v=20260831-8"></script>
<script src="js/homedeco_save.js?v=20260831-8"></script>
<script>
const fid=new URLSearchParams(location.search).get('furniture');
const f=HOMEDECO_FURNITURE[fid];
const addForm=document.getElementById('addForm');
const toggleAddBtn=document.getElementById('toggleAddBtn');
const cancelAddBtn=document.getElementById('cancelAddBtn');
const sectionSelect=document.getElementById('itemSection');
const itemName=document.getElementById('itemName');
const itemQuantity=document.getElementById('itemQuantity');
const itemUnit=document.getElementById('itemUnit');
const favoriteField=document.getElementById('favoriteField');
const favoriteItems=document.getElementById('favoriteItems');
const quantityPicks=document.getElementById('quantityPicks');
const unitPicks=document.getElementById('unitPicks');
const COMMON_UNITS=['個','本','袋','パック','箱','枚','ロール','丁','束','g','kg','ml','L'];

if(!f){
  location.href='homedeco_menu.html?v=20260831-8';
}else{
  document.getElementById('furnitureName').textContent=f.name;
  document.getElementById('backBtn').onclick=()=>location.href='homedeco_room.html?room='+encodeURIComponent(f.room)+'&v=20260831-8';
  f.sections.forEach(secName=>{
    const opt=document.createElement('option');
    opt.value=secName;
    opt.textContent=secName;
    sectionSelect.appendChild(opt);
  });
  if(fid==='fridge'){
    favoriteField.hidden=false;
    document.getElementById('itemNameLabel').textContent='なければ入力';
    renderFavorites();
  }
  renderQuantityPicks();
  renderUnitPicks();
  render();
}

function renderFavorites(){
  if(fid!=='fridge')return;
  favoriteItems.innerHTML='';
  HomeDecoSave.getFavorites('fridge').forEach(fav=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='quick-pick-btn';
    b.textContent=fav.name;
    b.onclick=()=>{
      itemName.value=fav.name;
      favoriteItems.querySelectorAll('.quick-pick-btn').forEach(x=>x.classList.toggle('selected',x===b));
    };
    favoriteItems.appendChild(b);
  });
}

function renderQuantityPicks(){
  quantityPicks.innerHTML='';
  for(let n=1;n<=20;n++){
    const b=document.createElement('button');
    b.type='button';
    b.className='quick-pick-btn';
    b.dataset.quantity=String(n);
    b.textContent=String(n);
    b.onclick=()=>{itemQuantity.value=String(n);syncQuantitySelection();};
    quantityPicks.appendChild(b);
  }
  syncQuantitySelection();
}

function syncQuantitySelection(){
  const value=String(itemQuantity.value);
  quantityPicks.querySelectorAll('.quick-pick-btn').forEach(b=>b.classList.toggle('selected',b.dataset.quantity===value));
}

function renderUnitPicks(){
  unitPicks.innerHTML='';
  COMMON_UNITS.forEach(unit=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='quick-pick-btn';
    b.dataset.unit=unit;
    b.textContent=unit;
    b.onclick=()=>{itemUnit.value=unit;syncUnitSelection();};
    unitPicks.appendChild(b);
  });
}

function syncUnitSelection(){
  const value=itemUnit.value.trim();
  unitPicks.querySelectorAll('.quick-pick-btn').forEach(b=>b.classList.toggle('selected',b.dataset.unit===value));
}
itemUnit.addEventListener('input',syncUnitSelection);

toggleAddBtn.onclick=()=>{
  addForm.hidden=!addForm.hidden;
  toggleAddBtn.textContent=addForm.hidden?'＋ 中身を追加':'− 入力を閉じる';
  if(!addForm.hidden&&fid!=='fridge')itemName.focus();
};
cancelAddBtn.onclick=()=>{
  addForm.hidden=true;
  addForm.reset();
  itemQuantity.value=1;
  toggleAddBtn.textContent='＋ 中身を追加';
  favoriteItems.querySelectorAll('.quick-pick-btn').forEach(x=>x.classList.remove('selected'));
  syncQuantitySelection();
  syncUnitSelection();
};

addForm.addEventListener('submit',e=>{
  e.preventDefault();
  if(!f)return;
  const name=itemName.value.trim();
  const unit=itemUnit.value.trim();
  if(!name)return;
  HomeDecoSave.addItem({
    name,
    furniture:fid,
    section:sectionSelect.value,
    quantity:itemQuantity.value,
    unit,
    expiration:document.getElementById('itemExpiration').value,
    memo:document.getElementById('itemMemo').value
  });
  if(fid==='fridge')HomeDecoSave.addFavorite('fridge',name,unit);
  addForm.reset();
  itemQuantity.value=1;
  addForm.hidden=true;
  toggleAddBtn.textContent='＋ 中身を追加';
  favoriteItems.querySelectorAll('.quick-pick-btn').forEach(x=>x.classList.remove('selected'));
  syncQuantitySelection();
  syncUnitSelection();
  if(fid==='fridge')renderFavorites();
  render();
});

function sectionTone(secName){
  if(secName.includes('冷蔵'))return 'storage-cold';
  if(secName.includes('野菜'))return 'storage-veg';
  if(secName.includes('冷凍'))return 'storage-freeze';
  return 'storage-normal';
}

function render(){
  if(!f)return;
  const s=HomeDecoSave.ensure(),root=document.getElementById('contents');
  root.innerHTML='';
  f.sections.forEach(secName=>{
    const rows=Object.entries(s.items).filter(([,i])=>i.furniture===fid&&i.section===secName);
    const sec=document.createElement('section');
    sec.className='storage-section '+sectionTone(secName)+(fid==='fridge'?' fridge-section':'');

    const header=document.createElement('div');
    header.className='storage-section-head';
    const h=document.createElement('h2');
    h.className='section-title';
    h.textContent=secName;
    const count=document.createElement('span');
    count.className='section-count';
    count.textContent=rows.length+'件';
    header.append(h,count);
    sec.appendChild(header);

    if(fid==='fridge'){
      const list=document.createElement('div');
      list.className='fridge-list';
      if(rows.length){
        const tableHead=document.createElement('div');
        tableHead.className='fridge-table-head';
        tableHead.innerHTML='<span>商品名</span><span>残数量</span><span>期限</span>';
        list.appendChild(tableHead);
        rows.forEach(([iid,item])=>list.appendChild(fridgeRow(iid,item)));
      }else{
        const e=document.createElement('div');
        e.className='fridge-empty';
        e.textContent='空';
        list.appendChild(e);
      }
      sec.appendChild(list);
    }else{
      const list=document.createElement('div');
      list.className='item-list';
      if(!rows.length){
        const e=document.createElement('div');
        e.className='empty compact-empty';
        e.textContent='空';
        list.appendChild(e);
      }
      rows.forEach(([iid,item])=>list.appendChild(itemCard(iid,item)));
      sec.appendChild(list);
    }
    root.appendChild(sec);
  });
}

function shortDate(value){
  if(!value)return '—';
  const m=String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m?m[1].slice(2)+'/'+m[2]+'/'+m[3]:String(value);
}

function fridgeRow(iid,item){
  const wrap=document.createElement('div');
  wrap.className='fridge-row-wrap';

  const row=document.createElement('button');
  row.type='button';
  row.className='fridge-row';
  const qty=String(item.quantity??'')+(item.unit?' '+item.unit:'');
  row.innerHTML='<span class="fridge-name">'+esc(item.name)+'</span><span class="fridge-qty">'+esc(qty||'—')+'</span><span class="fridge-exp">'+esc(shortDate(item.expiration))+'</span>';

  const actions=document.createElement('div');
  actions.className='fridge-edit-actions';
  actions.hidden=true;
  actions.append(
    actionButton('数量',()=>changeQuantity(iid,item)),
    actionButton('場所',()=>changeSection(iid,item)),
    actionButton('期限',()=>changeExpiration(iid,item)),
    actionButton('削除',()=>removeItem(iid,item),'danger')
  );

  row.onclick=()=>{actions.hidden=!actions.hidden;row.classList.toggle('open',!actions.hidden);};
  wrap.append(row,actions);
  return wrap;
}

function actionButton(label,handler,extraClass=''){
  const b=document.createElement('button');
  b.type='button';
  b.className='btn fridge-edit-btn'+(extraClass?' '+extraClass:'');
  b.textContent=label;
  b.onclick=handler;
  return b;
}

function changeQuantity(iid,item){
  const n=prompt('数量',item.quantity);
  if(n===null)return;
  const v=Number(n);
  if(!Number.isFinite(v)||v<0)return alert('0以上の数字を入力してください。');
  HomeDecoSave.updateItem(iid,{quantity:v});
  render();
}

function changeSection(iid,item){
  const current=f.sections.indexOf(item.section);
  const options=f.sections.map((x,i)=>(i+1)+': '+x).join('\n');
  const n=prompt('移動先の番号を入力してください。\n'+options,current+1);
  if(n===null)return;
  const index=Number(n)-1;
  if(!Number.isInteger(index)||!f.sections[index])return alert('番号を選んでください。');
  HomeDecoSave.updateItem(iid,{section:f.sections[index]});
  render();
}

function changeExpiration(iid,item){
  const v=prompt('期限（例：2026-08-31）',item.expiration||'');
  if(v===null)return;
  HomeDecoSave.updateItem(iid,{expiration:v});
  render();
}

function removeItem(iid,item){
  if(!confirm(item.name+'を一覧から削除しますか？'))return;
  HomeDecoSave.removeItem(iid);
  render();
}

function itemCard(iid,item){
  const d=document.createElement('article');
  d.className='item storage-item';
  const rule=HOMEDECO_GOMI_RULES[item.garbage];
  const expiration=item.expiration||'未登録';
  const memo=item.memo?'<div class="item-detail"><span class="detail-label">メモ</span><span>'+esc(item.memo)+'</span></div>':'';
  const trashInfo=rule?'<div class="item-detail"><span class="detail-label">捨て方</span><span>'+esc(rule.label)+'</span></div>':'';
  d.innerHTML='<div class="item-head"><span class="item-name">'+esc(item.name)+'</span><span class="badge quantity-badge">'+esc(item.quantity)+' '+esc(item.unit||'')+'</span></div><div class="item-meta"><div class="item-detail"><span class="detail-label">期限</span><span>'+esc(expiration)+'</span></div>'+memo+trashInfo+'</div>';

  const a=document.createElement('div');
  a.className='item-actions storage-actions';
  a.append(
    actionButton('数量変更',()=>changeQuantity(iid,item)),
    actionButton('場所変更',()=>changeSection(iid,item)),
    actionButton('期限変更',()=>changeExpiration(iid,item)),
    actionButton('削除',()=>removeItem(iid,item),'danger')
  );
  d.appendChild(a);
  return d;
}

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
</body>
</html>
