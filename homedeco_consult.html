<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>収納・ゴミ相談</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="topbar"><button class="btn" onclick="location.href='homedeco_menu.html'">←</button><h1>収納・ゴミ相談</h1></div><section class="panel"><div class="field"><label for="q">物の名前</label><input id="q" placeholder="例：乾電池"></div><div class="actions"><button class="btn primary" id="whereBtn">どこにある？</button><button class="btn soft" id="gomiBtn">何ゴミ？</button></div><div id="result" class="result">ここでは登録済みの家データと分別JSを検索します。</div></section><p class="muted">AI接続はまだ入れていません。GitHub PagesへAPIキーを直接置かない構成にしています。</p></main><script src="js/homedeco_rooms.js"></script><script src="js/homedeco_furniture.js"></script><script src="js/homedeco_items.js"></script><script src="js/homedeco_gomi_rules.js"></script><script src="js/homedeco_save.js"></script><script>
const q=document.getElementById('q'),r=document.getElementById('result');document.getElementById('whereBtn').onclick=()=>{const term=q.value.trim();if(!term)return;r.innerHTML='';const s=HomeDecoSave.ensure();const hits=Object.values(s.items).filter(i=>i.name.includes(term)||term.includes(i.name));if(!hits.length){r.textContent='登録済みの持ち物には見つかりませんでした。';return}r.innerHTML=hits.map(i=>{const f=HOMEDECO_FURNITURE[i.furniture],room=f&&HOMEDECO_ROOMS[f.room];return '<strong>'+esc(i.name)+'</strong><br>'+(room?esc(room.name)+' → ':'')+(f?esc(f.name)+' → ':'')+esc(i.section)+'<br><span class="muted">'+i.quantity+' '+esc(i.unit||'')+'</span>'}).join('<hr>')};document.getElementById('gomiBtn').onclick=()=>{const term=q.value.trim();if(!term)return;const hits=Object.values(HOMEDECO_GOMI_RULES).filter(x=>x.label.includes(term)||x.keywords.some(k=>k.includes(term)||term.includes(k)));if(!hits.length){r.textContent='分別JSには見つかりませんでした。地域の公式ルール確認が必要です。';return}r.innerHTML=hits.map(x=>'<strong>'+esc(x.label)+'</strong><br>'+esc(x.note)).join('<hr>')};function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
