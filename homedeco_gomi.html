<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ゴミ袋</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="topbar"><button class="btn" onclick="history.length>1?history.back():location.href='homedeco_menu.html'">←</button><h1>ゴミ袋</h1><button class="btn" onclick="location.href='homedeco_menu.html'">部屋</button></div><div class="notice">収集曜日は地域データが未設定です。<code>js/homedeco_gomi_schedule.js</code> に実際の曜日を登録できます。</div><section id="bags" class="gomi-grid"></section></main><script src="js/homedeco_items.js"></script><script src="js/homedeco_gomi_schedule.js"></script><script src="js/homedeco_gomi_rules.js"></script><script src="js/homedeco_save.js"></script><script>
function render(){const s=HomeDecoSave.ensure(),root=document.getElementById('bags');root.innerHTML='';Object.entries(HOMEDECO_GOMI_SCHEDULE).forEach(([cat,cfg])=>{const bag=document.createElement('section');bag.className='gomi-bag';const items=s.trash[cat]||[];const days=cfg.weekdays&&cfg.weekdays.length?cfg.weekdays.join('・'):'未設定';bag.innerHTML='<h2>'+cfg.name+'</h2><div class="muted">ゴミの日：'+days+'</div>';if(items.length){const ul=document.createElement('ul');ul.className='gomi-items';items.forEach(i=>{const li=document.createElement('li');li.textContent=i.name+' × '+i.quantity+(i.unit||'');ul.appendChild(li)});bag.appendChild(ul);const b=document.createElement('button');b.className='btn';b.textContent='この袋を出した';b.onclick=()=>{if(confirm(cfg.name+'の中身を空にしますか？')){HomeDecoSave.emptyBag(cat);render()}};bag.appendChild(b)}else{const e=document.createElement('div');e.className='empty';e.textContent='まだ入っていません';bag.appendChild(e)}root.appendChild(bag)});const other=(s.trash.unclassified||[]);if(other.length){const bag=document.createElement('section');bag.className='gomi-bag';bag.innerHTML='<h2>未分類</h2>';const ul=document.createElement('ul');other.forEach(i=>{const li=document.createElement('li');li.textContent=i.name+' × '+i.quantity+(i.unit||'');ul.appendChild(li)});bag.appendChild(ul);root.appendChild(bag)}}render();
</script></body></html>
